<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สร้างบัญชี • Our Days</title><style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
:root{font-family:Kanit,system-ui,sans-serif;color:#413747}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 5% 7%,#ffe2ed 0,transparent 35%),radial-gradient(circle at 96% 39%,#efe8ff 0,transparent 35%),#fff9fb}.card{width:min(100%,430px);padding:34px;background:#fff;border:1px solid #f5e1ed;border-radius:28px;box-shadow:0 18px 50px #a7568125}.heart{font-size:3rem;color:#c15b93;line-height:1}.eyebrow{color:#a7608a;font-size:.88rem;font-weight:600;letter-spacing:.07em}h1{color:#7d476d;line-height:1.15;margin:8px 0}.muted{color:#8f7b8d}label{display:block;font-weight:600;margin:14px 0 6px}input{font:inherit;width:100%;padding:12px 14px;border:1px solid #eedce7;border-radius:13px}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #ef95c0;outline-offset:2px}button,.button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:11px 17px;font-weight:600;text-decoration:none;text-align:center;display:block;width:100%}button{background:linear-gradient(135deg,#b54b85,#9253a0);color:#fff;margin-top:23px}button:disabled{opacity:.65;cursor:wait}.button{background:#f7e9f1;color:#833f6b;margin-top:10px}.error{color:#b13b59;min-height:1.5em}
</style></head><body><main class="card"><div class="heart">♡</div><div class="eyebrow">OUR LITTLE STORY</div><h1>สร้างบัญชีใหม่</h1><p class="muted">เก็บความทรงจำในบัญชีของคุณ</p><form id="signupForm"><label for="email">อีเมล</label><input id="email" type="email" autocomplete="email" required><label for="password">รหัสผ่าน</label><input id="password" type="password" autocomplete="new-password" minlength="6" required><label for="confirmPassword">ยืนยันรหัสผ่านอีกครั้ง</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required><button id="submitBtn" type="submit">สร้างบัญชี</button></form><p id="error" role="alert" class="error"></p><a href="index.html" class="button">มีบัญชีแล้ว? เข้าสู่ระบบ</a></main><script type="module" src="signup.js"></script></body></html>
